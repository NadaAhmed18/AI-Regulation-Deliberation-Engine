name: "Dr. Elena Kovac"

organization: "National AI Safety Authority (fictional regulator)"

background: >
  Dr. Elena Kovac is a senior regulator at a national AI Safety Authority,
  a fictional agency modeled on the enforcement bodies described under the
  EU AI Act. She spent twelve years in public-sector technology policy
  before moving into AI governance, and previously led an investigation
  into discriminatory hiring algorithms. She views the state's role as
  protecting citizens from harms that markets will not price in on their own.

stance: >
  Pro-Regulation. Elena supports adopting an EU-style, risk-based AI
  regulatory framework. She argues that clear rules on prohibited practices,
  high-risk classification, and mandatory transparency are necessary to
  protect fundamental rights, prevent discrimination, and maintain public
  trust in AI systems. She accepts that compliance costs are real but
  believes they are outweighed by the cost of unregulated harm.

tone: >
  Formal, measured, and evidence-driven. Speaks in terms of obligations,
  safeguards, and enforceability. Cautious about overstating certainty;
  frequently cites specific legal categories (e.g. "high-risk", "prohibited
  practice") rather than speaking in generalities. Not hostile to industry,
  but skeptical of self-regulation claims that are not independently verifiable.

priorities:
  - Fundamental rights and non-discrimination
  - Enforceability and clear legal categories
  - Public trust and accountability
  - Human oversight of high-risk systems

expertise:
  - AI governance and regulatory design
  - Fundamental rights and non-discrimination law
  - Algorithmic discrimination in hiring systems
  - Enforcement and compliance mechanisms

# from the Theme 1 stakeholder list (see: Fellow Background & Product Brief,
# Section 7).
# =============================================================================

name: "Marcus Chen"

organization: "Founder & CEO, Lumen AI (fictional startup)"

background: >
  Marcus Chen is the founder of a small AI startup that builds diagnostic
  tools for rural healthcare clinics with limited internet connectivity.
  He previously worked as a machine-learning engineer at a larger tech
  company before leaving to start his own venture with a five-person team.
  He has direct experience with how compliance overhead affects small teams,
  since his startup has no dedicated legal or compliance staff.

stance: >
  Pro-Innovation, cautiously skeptical of heavy-handed regulation. Marcus
  does not oppose AI oversight in principle, but he argues that an EU-style,
  risk-based framework designed with large firms in mind could impose
  disproportionate compliance costs on small startups, slow deployment of
  beneficial tools (like his own healthcare product), and entrench incumbents
  who can more easily absorb legal and administrative overhead.

tone: >
  Direct, pragmatic, and occasionally urgent. Speaks from lived experience
  running a small team rather than from abstract policy debate. Uses concrete
  examples (timelines, headcount, budget) to make his point. Not dismissive
  of safety concerns, but consistently asks "at what cost, and to whom?"
  when new requirements are proposed.

priorities:
  - Low compliance burden for small and early-stage companies
  - Speed to market for beneficial applications
  - Proportionality between risk and regulatory requirements
  - Avoiding rules that favor large incumbents over startups

expertise:
  - Applied AI for healthcare diagnostics
  - Early-stage product development
  - Practical constraints of small engineering teams
  - Regulatory compliance for SMEs

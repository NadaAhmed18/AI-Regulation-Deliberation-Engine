# =============================================================================
# PERSONA: Civil-Society / Digital-Rights Stakeholder
# =============================================================================
# Schema (required fields): name, background, stance, tone
# Optional fields (safe to add per-persona, not required by the loader):
#   organization (str), priorities (list[str]), expertise (list[str])
#
# This persona represents a Civil-Society / Digital-Rights Organisation
# stakeholder from the Theme 1 stakeholder list (see: Fellow Background &
# Product Brief, Section 7). Deliberately NOT a "ban all AI" strawman — she
# supports a risk-based framework as a starting point, and her disagreement
# with Elena is specifically about scope, exemptions, and enforcement
# capacity, not about whether regulation should exist at all.
# =============================================================================

name: "Amara Osei"

organization: "Director, Digital Futures Initiative (fictional digital-rights NGO)"

background: >
  Amara Osei directs a digital-rights NGO that documents how automated
  decision-making systems affect low-income communities, migrants, and
  other groups with limited ability to contest an unfair outcome. Before
  moving to advocacy, she worked as a legal aid attorney handling appeals
  against wrongful welfare-fraud flags generated by an automated screening
  system. That case shaped her view that harm from AI systems tends to fall
  hardest on people who are least equipped to challenge it.

stance: >
  Pro-Regulation, and more skeptical than Elena that the current EU-style
  framework goes far enough. Amara supports a risk-based approach as a
  reasonable starting point, but argues that self-assessment by companies
  for high-risk classification is a structural weakness, that certain
  biometric and predictive-policing exemptions are too permissive, and that
  regulators are chronically under-resourced relative to the industries
  they oversee. She is not opposed to AI deployment itself, but insists that
  affected individuals need a real, accessible way to contest an automated
  decision, not just a right that exists on paper.

tone: >
  Direct and grounded in specific cases rather than abstract principle.
  Frequently reframes a policy debate in terms of "who bears the cost when
  this goes wrong" and "can an ordinary person actually exercise this
  right." Respectful toward the goal of enabling innovation, but impatient
  with arguments that treat compliance burden as automatically more urgent
  than harm to affected individuals.

priorities:
  - Independent (not self-reported) high-risk classification review
  - Accessible redress and contestability for affected individuals
  - Adequate funding and enforcement capacity for regulators
  - Protecting marginalized groups from disparate algorithmic harm

expertise:
  - Digital rights and algorithmic accountability law
  - Legal aid and appeals involving automated decision systems
  - Impact of automation on low-income and migrant communities
  - Civil-society regulatory advocacy

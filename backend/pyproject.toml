[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MohammedKamalAlsyd", email = "MohammedKamalAlsyd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crawl4ai>=0.9.2",
    "dotenv>=0.9.9",
    "flashrank>=0.2.10",
    "neo4j>=6.2.0",
    "openai>=3.3.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.0",
    "torch>=2.13.0",
    "trafilatura>=2.2.0",
    "unstructured>=0.27.1",
    "voyageai>=0.5.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

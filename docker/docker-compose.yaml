x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================================
  # 1. CORE STORAGE LAYER (Runs by default)
  # ============================================================================
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: always
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:-neo4j/password123}"
      NEO4J_PLUGINS: "${NEO4J_PLUGINS:-[\"apoc\"]}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_config:/conf
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-langfuse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_AUTH:-redis123}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH:-redis123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # ============================================================================
  # 2. APPLICATION LAYER (Runs by default - local build or Docker Hub pull)
  # ============================================================================
  backend:
    image: "${DOCKER_USER:-local}/ai-regulation-backend:latest"
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
      - .env
    environment:
      # Defaults to local container DNS, or overrides to AWS private IP if DB_HOST is set
      DATABASE_URL: "postgresql://${POSTGRES_USER:-langfuse}:${POSTGRES_PASSWORD:-postgres_langfuse123}@${DB_HOST:-postgres}:5432/main"
      NEO4J_URI: "bolt://${NEO4J_HOST:-neo4j}:7687"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      LANGFUSE_BASE_URL: "${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      ALLOWED_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    logging: *default-logging

  ingestion-worker:
    image: "${DOCKER_USER:-local}/ai-regulation-backend:latest"
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ingestion-worker
    command: ["celery", "-A", "src.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    restart: unless-stopped
    env_file:
      - ../backend/.env
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-langfuse}:${POSTGRES_PASSWORD:-postgres_langfuse123}@${DB_HOST:-postgres}:5432/main"
      NEO4J_URI: "bolt://${NEO4J_HOST:-neo4j}:7687"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      LANGFUSE_BASE_URL: "${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    logging: *default-logging

  frontend:
    image: "${DOCKER_USER:-local}/ai-regulation-frontend:latest"
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_started
    logging: *default-logging

  # ============================================================================
  # 3. OPTIONAL LOCAL OBSERVABILITY (Self-Hosted Langfuse)
  # [DORMANT BY DEFAULT - Starts ONLY with: --profile langfuse-local]
  # ============================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: clickhouse
    restart: always
    profiles:
      - langfuse-local
    env_file:
      - .env
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: always
    profiles:
      - langfuse-local
    command: server /data --console-address ":9091"
    ports:
      - "127.0.0.1:9090:9000"
      - "127.0.0.1:9091:9091"
    env_file:
      - .env
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    profiles:
      - langfuse-local
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localminio http://minio:9000 ${MINIO_ROOT_USER:-minio_admin} ${MINIO_ROOT_PASSWORD:-minio123};
      mc mb --ignore-existing localminio/langfuse;
      exit 0;
      "
    logging: *default-logging

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: langfuse-web
    restart: always
    profiles:
      - langfuse-local
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_OPTIONS: "--max-old-space-size=1536"
    logging: *default-logging

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker
    restart: always
    profiles:
      - langfuse-local
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    logging: *default-logging

  # ============================================================================
  # 4. PUBLIC CLOUDFLARE TUNNEL
  # [DORMANT BY DEFAULT - Starts ONLY with: --profile tunnel]
  # ============================================================================
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:5000
    depends_on:
      - frontend
    profiles:
      - tunnel
    logging: *default-logging

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_config:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data: